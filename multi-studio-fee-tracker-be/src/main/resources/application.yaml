server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: multi-studio-fee-tracker-be
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:multistudiofeetracker}
    username: ${DB_USER:multistudiofeetracker}
    # Solo per sviluppo: in produzione impostare la variabile d'ambiente DB_PASSWORD.
    password: ${DB_PASSWORD:multistudiofeetracker}
  jpa:
    hibernate:
      # No migration tool (Flyway/Liquibase) in place: Hibernate tiene lo schema sincronizzato.
      ddl-auto: update

jwt:
  # Solo per sviluppo: in produzione impostare la variabile d'ambiente JWT_SECRET (≥32 byte).
  secret: ${JWT_SECRET:fj7hp1cqn+TEHc4uxY+zM3f/ofB4ZVGMKCshzGbsrkMq2DQuU5AD7GaA95R8v5XS}
  expiration-ms: 86400000

admin:
  # Nessun default: se non impostate entrambe, nessun utente admin viene creato al boot.
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}
